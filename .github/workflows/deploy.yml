name: Check and deploy InsertCreator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested current main revision to insertcreator.com'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and deployment scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - name: Validate deployment package without connecting
        run: python scripts/deploy_static.py --source dist --revision "$GITHUB_SHA" --dry-run
      - name: Confirm tests did not modify production files
        shell: bash
        run: |
          git diff --exit-code -- dist
          deploy_dist_changes=$(git status --porcelain --untracked-files=all -- dist)
          if [[ -n "$deploy_dist_changes" ]]; then
            printf '%s\n' "$deploy_dist_changes"
            exit 1
          fi

  deploy:
    name: Deploy and verify insertcreator.com
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (vars.DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    environment: ftp
    timeout-minutes: 20
    concurrency:
      group: insertcreator-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Skip a revision superseded on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`,
            {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}}
          );
          if (!response.ok) throw new Error(`Cannot verify current main revision (HTTP ${response.status}).`);
          const ref = await response.json();
          const current = ref.object?.sha === process.env.GITHUB_SHA;
          appendFileSync(process.env.GITHUB_OUTPUT, `current=${current}\n`);
          console.log(current ? 'Deploying the tested current main revision.' : 'Skipping a superseded revision.');
          JS
      - name: Install hash-locked SFTP dependencies
        if: steps.current.outputs.current == 'true'
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-deploy.txt
      - name: Upload production files through verified SFTP
        if: steps.current.outputs.current == 'true'
        env:
          FTP_HOST: ftp.insertcreator.com
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_KNOWN_HOSTS: ${{ secrets.FTP_KNOWN_HOSTS }}
          DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || 'public_html' }}
          DEPLOY_ALLOW_SCOPED_ROOT: ${{ vars.DEPLOY_ALLOW_SCOPED_ROOT || 'false' }}
        run: python scripts/deploy_static.py --source dist --revision "$GITHUB_SHA"
      - name: Verify published revision and every file over HTTPS
        if: steps.current.outputs.current == 'true'
        run: python scripts/verify_deployment.py --url https://insertcreator.com --source dist --revision "$GITHUB_SHA"
