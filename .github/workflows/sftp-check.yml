name: Check SFTP connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check login and webroot without uploading
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ftp
    timeout-minutes: 5
    concurrency:
      group: insertcreator-sftp-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify deployment scripts offline
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Install hash-locked SFTP dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-deploy.txt
      - name: Check server identity, login and existing webroot
        env:
          FTP_HOST: ftp.insertcreator.com
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_KNOWN_HOSTS: ${{ secrets.FTP_KNOWN_HOSTS }}
          DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || 'public_html' }}
          DEPLOY_ALLOW_SCOPED_ROOT: ${{ vars.DEPLOY_ALLOW_SCOPED_ROOT || 'false' }}
        run: python scripts/deploy_static.py --source dist --revision "$GITHUB_SHA" --check-connection
